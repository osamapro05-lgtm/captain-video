<template>
  <style>
@font-face { font-family: 'Cairo'; src: url('assets/fonts/Cairo-VF.ttf'); font-weight: 200 1000; }
@font-face { font-family: 'Plex'; src: url('assets/fonts/IBMPlexSansArabic-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Amiri'; src: url('assets/fonts/AmiriQuran-Regular.ttf'); }

#root { position: absolute; inset: 0; color: #fff; font-family: 'Cairo'; direction: rtl; overflow: hidden; }
.ttl { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 84px; line-height: 1.1; }
.inv { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 84px; line-height: 1.18; padding: 0 22px; white-space: nowrap; }
.inv.y { background: #FFD60A; color: #050505; } .inv.r { background: #FF3B30; color: #fff; }
.lab { position: absolute; font-family: 'Plex'; font-weight: 700; font-size: 38px; color: rgba(255,255,255,.72); text-align: center; white-space: nowrap; }
.num { position: absolute; font-family: 'Inter'; font-weight: 800; direction: ltr; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.card { position: absolute; background: rgba(10,10,10,.92); border: 2px solid rgba(255,255,255,.9); border-radius: 30px; box-shadow: 0 0 26px rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.05); }
.card.dim { border-color: rgba(255,255,255,.25); box-shadow: none; }

#pips { position: absolute; left: 470px; top: 168px; width: 140px; height: 10px; }
#pips i { position: absolute; top: 0; width: 40px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.22); }
#chap { left: 0; right: 0; top: 190px; color: #FF3B30; font-size: 36px; }
#nlab { left: 0; right: 0; top: 1100px; } #nnum { left: 0; right: 0; top: 1150px; font-size: 120px; }

#chartw { position: absolute; left: 140px; top: 520px; width: 800px; height: 520px; perspective: 1400px; }
#ch { position: absolute; inset: 0; }
#base { position: absolute; left: 60px; right: 60px; bottom: 60px; height: 3px; background: rgba(255,255,255,.4); }
#bar { position: absolute; left: 300px; width: 200px; bottom: 63px; height: 100px; border: 3px solid #fff; border-bottom: 0; border-radius: 10px 10px 0 0; background: rgba(255,255,255,.08); }
#learn { position: absolute; left: 70px; right: 70px; top: 230px; height: 44px; border-radius: 22px; border: 2px solid rgba(255,255,255,.35); }
#lfill { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 22px; background: #FFD60A; box-shadow: 0 0 22px rgba(255,214,10,.7); }
#llab { right: 70px; top: 160px; }
.step { position: absolute; bottom: 63px; width: 110px; border: 3px solid #FFD60A; border-bottom: 0; border-radius: 8px 8px 0 0; background: rgba(255,214,10,.1); box-shadow: 0 0 18px rgba(255,214,10,.45); transform-origin: bottom; }
.stl { position: absolute; width: 110px; text-align: center; font: 800 30px 'Inter'; color: #fff; direction: ltr; }
</style>
  <div id="root" data-composition-id="m1" data-width="1080" data-height="1920">
<div id="pips"><i style="right:0px;background:#FF3B30"></i><i style="right:50px"></i><i style="right:100px"></i></div><div id="chap" class="lab">غلطة 1 من 3</div>    <div id="m1t0" class="ttl" data-layout-allow-overlap style="top:255px;opacity:0">بتعلّي الميزانية</div><div id="m1l0" class="inv r" data-layout-allow-overlap style="top:355px;opacity:0">مرة واحدة</div>
    <div id="m1t1" class="ttl" data-layout-allow-overlap style="top:255px;opacity:0;font-size:60px;color:#9A9A9A">الحل</div><div id="m1l1" class="inv y" data-layout-allow-overlap style="top:355px;opacity:0">زوّد بالراحة</div>
    <div id="chartw"><div id="ch" class="card"><div id="base"></div><div id="bar"></div>
      <div id="llab" class="lab">ميتا بتتعلّم</div><div id="learn"><div id="lfill"></div></div><div id="st0" class="step" style="left:70px;height:70px"></div><div id="sl0" class="stl" style="left:70px;bottom:150px">+20%</div><div id="st1" class="step" style="left:200px;height:140px"></div><div id="sl1" class="stl" style="left:200px;bottom:220px">+20%</div><div id="st2" class="step" style="left:330px;height:210px"></div><div id="sl2" class="stl" style="left:330px;bottom:290px">+20%</div><div id="st3" class="step" style="left:460px;height:280px"></div><div id="sl3" class="stl" style="left:460px;bottom:360px">+20%</div><div id="st4" class="step" style="left:590px;height:350px"></div><div id="sl4" class="stl" style="left:590px;bottom:430px">+20%</div></div></div>
    <div id="nlab" class="lab"></div><div id="nnum" class="num"></div>
  </div>
  <script>
    
const cl = v => Math.max(0, Math.min(1, v));
const k = (t, a, d = 0.5) => { const x = cl((t - a) / d); return 1 - Math.pow(1 - x, 3); };
const kb = (t, a, d = 0.45) => { const x = cl((t - a) / d), s = 1.7; return x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const lin = (t, a, b) => cl((t - a) / (b - a));
const jit = (t, f = 9) => Math.sin(t * f * 1.3) * 0.6 + Math.sin(t * f * 2.7 + 1) * 0.4;
const $ = id => document.getElementById(id);
const fmt = v => Math.round(v).toLocaleString('en-US');
const show = (el, a, dy = 0, sc = 1) => { el.style.opacity = a; el.style.transform = (el.dataset.base || '') + ` translateY(${dy}px) scale(${sc})`; };
const reveal = (el, a) => { el.style.opacity = a > 0 ? 1 : 0; el.style.clipPath = `inset(0 0 0 ${(1 - a) * 100}%)`; };

    const tl = gsap.timeline({ paused: true });
    const S = { t: 0 };
    function render(t) {

      const setNum = (l, v, c = '#fff', lc) => { $('nlab').textContent = l; $('nlab').style.color = lc || (c === '#fff' ? 'rgba(255,255,255,.72)' : c); $('nnum').textContent = v; $('nnum').style.color = c;
        $('nnum').style.textShadow = c === '#fff' ? 'none' : `0 0 26px ${c === '#FF3B30' ? 'rgba(255,59,48,.6)' : 'rgba(255,214,10,.5)'}`; };

      const phase = (pre, i, t, a, b, ls) => { const kin = k(t, a, 0.35), kout = b == null ? 0 : k(t, b, 0.3), al = kin * (1 - kout);
        $(pre + 't' + i).style.opacity = al; $(pre + 't' + i).style.transform = `translateY(${(1 - kin) * 30}px)`;
        reveal($(pre + 'l' + i), ls == null ? 0 : k(t, ls, 0.45)); $(pre + 'l' + i).style.opacity = (ls != null && t > ls) ? al : 0; return al; };

      const kc = k(t, 0.05, 0.4); $('pips').style.opacity = kc; $('chap').style.opacity = kc;
      phase('m1', 0, t, 1.17 - 0.15, 5.07 - 0.25, 2.09 - 0.08); phase('m1', 1, t, 5.07 - 0.2, null, 5.07 - 0.1);
      const j = kb(t, 2.09 - 0.05, 0.4), red = j > 0.3, shk = j > 0 && t < 2.09 + 0.5 ? 10 * jit(t, 45) : 0;
      const kB = k(t, 2.87 - 0.3, 0.35), kC = k(t, 5.07 - 0.25, 0.4);
      $('bar').style.height = (100 + 300 * j) + 'px'; $('bar').style.borderColor = red ? '#FF3B30' : '#fff'; $('bar').style.opacity = 1 - Math.max(kC, 0.75 * kB);
      $('bar').style.background = red ? 'rgba(255,59,48,.18)' : 'rgba(255,255,255,.08)'; $('bar').style.boxShadow = red ? '0 0 34px rgba(255,59,48,.7)' : '0 0 20px rgba(255,255,255,.35)';
      $('ch').style.transform = `rotateX(${6 + 3 * Math.sin(t)}deg) rotateY(${-14 * Math.sin(t * 0.6)}deg) translateX(${shk}px)`;
      // التعلّم بيتملا وبيرجع صفر عند «الأول»
      const learn = k(t, 2.87 - 0.2, 1.3) * (1 - k(t, 4.31, 0.15)), reset = k(t, 4.31, 0.15) * (1 - kC);
      $('learn').style.opacity = kB * (1 - kC); $('llab').style.opacity = kB * (1 - kC); $('lfill').style.width = (2 + 98 * learn) + '%';
      $('learn').style.borderColor = reset > 0.1 ? '#FF3B30' : 'rgba(255,255,255,.35)'; $('learn').style.boxShadow = reset > 0.1 ? '0 0 26px rgba(255,59,48,.8)' : 'none';
      // السلّم
      let n = 0; for (let i = 0; i < 5; i++) { const ks = kb(t, 5.29 + i * 0.48, 0.35); if (ks > 0.5) n++;
        $('st' + i).style.transform = `scaleY(${Math.max(0.001, ks)})`; $('st' + i).style.opacity = kC; $('sl' + i).style.opacity = kC * cl(ks); }
      if (t < 2.87 - 0.2) setNum('البودجت / يوم', '$' + fmt(100 + 900 * Math.min(1, j) + 0.5 * jit(t, 7)), red ? '#FF3B30' : '#fff');
      else if (kC < 0.5) setNum('ميتا بتتعلّم', fmt(86 * learn) + '%', reset > 0.1 ? '#FF3B30' : '#FFD60A');
      else setNum('+20% كل يومين تلاتة', '$' + fmt(100 * Math.pow(1.2, n)), '#fff', '#FFD60A');

    }
    tl.to(S, { t: 8.64, duration: 8.64, ease: 'none', onUpdate: () => render(S.t) }, 0);
    render(0);
    window.__timelines["m1"] = tl;
  </script>
</template>
