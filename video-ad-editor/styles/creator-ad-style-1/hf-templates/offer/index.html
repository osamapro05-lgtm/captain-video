<!doctype html>
<!-- CREATOR AD STYLE 1 — أوفرلاي «شرح العرض»: اسم العرض، والخدمات جاية من قدام الكاميرا واحدة واحدة مع نطقها، والسعر بيتختم في الآخر.
     انسخ المجلد لـ<work>/hf/offer-<id>، حط لقطة من الخدمة في assets/bg.jpg (اختياري)، وعدّل DATA بس (من facts.md). -->
<html lang="ar" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo-VF.ttf"); font-weight: 200 1000; }
      :root { --bg: #0B1414; --ink: #FFFFFF; --yellow: #F4F46A; --blue: #3FB4F0; --green: #6CF58A; --teal: #5CF0E6; --pink: #F2A8F5; --dark: #0B1B1B; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #scene { position: absolute; inset: 0; overflow: hidden; perspective: 1600px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 55% at 50% 45%, #123A3C 0%, #0D1E20 55%, var(--bg) 100%); }
      #photo { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(26px) brightness(.38) saturate(1.2); opacity: 0; }
      .bok { position: absolute; border-radius: 50%; }
      #ghost { position: absolute; top: 760px; left: -200px; right: -200px; text-align: center; font: 900 380px/1 "Cairo"; color: var(--green); opacity: 0.12; white-space: nowrap; direction: ltr; }
      #kicker { position: absolute; top: 280px; left: 0; right: 0; display: flex; justify-content: center; opacity: 0; }
      #kicker b { font: 900 44px/1 "Cairo"; color: var(--dark); padding: 14px 30px 18px; border-radius: 6px;
                  background: linear-gradient(180deg, #8FDBFF 0%, var(--blue) 55%, #1D6FE0 100%); box-shadow: 0 0 30px rgba(63,180,240,.55); }
      #title { position: absolute; top: 370px; left: 90px; right: 90px; text-align: center; font: 900 104px/1.05 "Cairo"; color: var(--ink); white-space: nowrap;
               text-shadow: 0 6px 14px rgba(0,0,0,.6); opacity: 0; }
      #list { position: absolute; top: 560px; left: 130px; right: 130px; display: flex; flex-direction: column; gap: 22px; transform-style: preserve-3d; }
      .row { display: flex; align-items: center; gap: 20px; padding: 18px 26px; border-radius: 22px; opacity: 0;
             background: rgba(255,255,255,.09); border: 2px solid rgba(255,255,255,.16); backdrop-filter: blur(10px);
             box-shadow: 0 24px 46px rgba(0,0,0,.4); }
      .row i { flex: none; width: 58px; height: 58px; border-radius: 12px; background: #2FBF4A; box-shadow: 0 0 20px rgba(108,245,138,.55); display: grid; place-items: center; }
      .row i svg { width: 38px; height: 38px; }
      .row span { font: 800 48px/1.1 "Cairo"; color: #fff; }
      #price { position: absolute; top: 1190px; left: 90px; right: 90px; display: flex; justify-content: center; gap: 40px; opacity: 0; }
      .p { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .p small { font: 800 40px/1 "Cairo"; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,.6); }
      .p b { font: 900 62px/1 "Cairo"; color: var(--dark); padding: 10px 34px 18px; border-radius: 8px;
             background: linear-gradient(90deg, rgba(108,245,138,0) 0%, var(--green) 14%, var(--green) 86%, rgba(108,245,138,0) 100%);
             box-shadow: 0 0 34px rgba(108,245,138,.5); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="bg"></div>
        <div id="photo"></div>
        <div class="bok" id="b1" style="left:-140px;top:260px;width:520px;height:520px;background:#1FA7A0;filter:blur(90px);opacity:.35"></div>
        <div class="bok" id="b2" style="left:640px;top:1200px;width:560px;height:560px;background:#2FBF4A;filter:blur(110px);opacity:.25"></div>
        <div id="ghost"></div>
        <div id="kicker"><b></b></div>
        <div id="title"></div>
        <div id="list"></div>
        <div id="price"></div>
      </div>
    </div>
    <script>
      /* ═══ DATA — الأوقات بالثواني من بداية الأوفرلاي (وقت نطق الكلمة في caps.json ناقص start). كل الكلام من facts.md ═══ */
      const DATA = {
        D: 6,
        photo: "",                                   // "assets/bg.jpg" لقطة من الخدمة تحت (مضببة وغامقة) — أو "" للخلفية السادة
        ghost: "60%",                                // كلمة أو رقم ضخم شفاف ورا (اختياري "")
        kicker: ["خصم 60% على كل العمليات", 0.05],
        title: ["باكج التعقيم الشامل", 0.6],
        rows: [["الكشف", 1.3], ["العملية + التخدير", 1.75], ["تحليل الدم", 2.2], ["الأدوية", 2.55], ["متابعة يومية على الواتساب", 2.9]],
        prices: [["حق القطو", "من 499 درهم", 3.9], ["حق الكلب", "من 649 درهم", 4.6]]
      };
      const $ = s => document.querySelector(s);
      if (DATA.photo) $("#photo").style.backgroundImage = `url(${DATA.photo})`;
      $("#ghost").textContent = DATA.ghost; $("#kicker b").textContent = DATA.kicker[0]; $("#title").textContent = DATA.title[0];
      const ck = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      $("#list").innerHTML = DATA.rows.map(([t]) => `<div class="row"><i>${ck}</i><span>${t}</span></div>`).join("");
      $("#price").innerHTML = DATA.prices.map(([l, p]) => `<div class="p"><small>${l}</small><b>${p}</b></div>`).join("");
      const fit = (el, max) => { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > max && fs > 30) { fs -= 2; el.style.fontSize = fs + "px"; } };
      fit($("#title"), 900); document.querySelectorAll(".p b").forEach(b => fit(b, 410));
      if (DATA.rows.length > 5) document.querySelectorAll(".row span").forEach(s => s.style.fontSize = "42px");

      const tl = gsap.timeline({ paused: true }), D = DATA.D;
      tl.fromTo("#scene", { opacity: 0, scale: 1.05, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);
      tl.to("#scene", { opacity: 0, scale: 1.06, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, D - 0.27);
      if (DATA.photo) tl.fromTo("#photo", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: D, ease: "none" }, 0);
      tl.fromTo(["#b1", "#b2"], { y: 50 }, { y: -50, duration: D, ease: "none" }, 0);
      tl.fromTo("#ghost", { opacity: 0, scale: 1.25, x: 30 }, { opacity: 0.12, scale: 1, x: -30, duration: D, ease: "power1.out" }, 0);
      // الكبسولة والعنوان بنطّة
      tl.fromTo("#kicker", { opacity: 0, scale: 0.85, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, DATA.kicker[1]);
      tl.fromTo("#title", { opacity: 0, scale: 1.3, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(1.5)" }, DATA.title[1]);
      // الخدمات جاية من قدام الكاميرا (كبيرة ومضببة) وبتقعد حادة، واحدة مع نطقها
      DATA.rows.forEach(([, at], i) => tl.fromTo(`.row:nth-child(${i + 1})`, { opacity: 0, scale: 1.6, z: 300, y: 80, filter: "blur(16px)" },
        { opacity: 1, scale: 1, z: 0, y: 0, filter: "blur(0px)", duration: 0.42, ease: "back.out(1.4)" }, at));
      tl.to("#list", { z: 60, duration: D - 1, ease: "sine.inOut" }, 1);
      // السعر: الصف بيظهر مع أول سعر، وكل سعر بيتختم بنطّة لما يتقال
      tl.fromTo("#price", { opacity: 0 }, { opacity: 1, duration: 0.01 }, DATA.prices[0][2] - 0.05);
      DATA.prices.forEach(([, , at], i) => tl.fromTo(`.p:nth-child(${i + 1})`, { opacity: 0, scale: 1.8, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(2.2)" }, at));
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
