<!doctype html>
<html lang="ar" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "AmiriBI"; src: url("assets/fonts/Amiri-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
      @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo-VF.ttf"); font-weight: 200 1000; }
      :root { --paper: #EFE4D2; --ink: #2A2422; --acc: #E9A23B; --red: #9E2A1E; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #scene { position: absolute; inset: 0; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 50%, #F7EEE1 0%, var(--paper) 55%, #D8C6AC 100%); }
      .bok { position: absolute; border-radius: 50%; }
      #lead { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font: 600 52px "Cairo"; color: var(--ink); }
      #lead span { display: inline-block; margin: 0 8px; opacity: 0; }
      #big { position: absolute; top: 1330px; left: -200px; right: -200px; text-align: center; font: italic 700 300px/1 "AmiriBI"; color: var(--acc); opacity: 0; white-space: nowrap; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1500px; perspective-origin: 540px 930px; }
      .item { position: absolute; left: 280px; top: 560px; width: 520px; height: 760px; }
      .lab { position: absolute; top: 0; left: -100px; right: -100px; text-align: center; font: italic 700 120px/1.1 "AmiriBI"; color: #6A2E22; }
      .card { position: absolute; top: 150px; left: 0; width: 520px; height: 600px; border-radius: 34px; overflow: hidden;
        background: radial-gradient(ellipse 70% 60% at 50% 42%, #F6E9D6 0%, #E6D2B6 70%, #D4BB98 100%);
        box-shadow: 0 46px 90px rgba(60,35,15,0.35), 0 10px 22px rgba(60,35,15,0.18); }
      .card svg { position: absolute; left: 60px; top: 70px; width: 400px; height: 400px; filter: drop-shadow(0 26px 22px rgba(80,25,15,0.35)); }
      .stamp { position: absolute; bottom: 44px; left: 50%; margin-left: -110px; width: 220px; padding: 10px 0; text-align: center; font: 700 46px "Cairo"; color: #FAF0E0; background: var(--red); border-radius: 6px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.29" data-width="1080" data-height="1920">
      <div id="scene" class="clip" data-start="0" data-duration="4.29" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="bg"></div>
        <div class="bok" id="b1" style="left:-140px;top:200px;width:520px;height:520px;background:#E9C79A;filter:blur(70px);opacity:.55"></div>
        <div class="bok" id="b2" style="left:620px;top:1250px;width:600px;height:600px;background:#D7A273;filter:blur(80px);opacity:.45"></div>
        <div id="big">للخطر</div>
        <div id="lead"><span>إنت</span><span>بتعرّض</span></div>
        <div id="stage">
          <div class="item" id="i0"><div class="lab">الكبد</div>
            <div class="card"><svg viewBox="0 0 300 300"><defs>
              <radialGradient id="lv" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#C9604F"/><stop offset="0.55" stop-color="#9A3328"/><stop offset="1" stop-color="#5E1712"/></radialGradient>
              <radialGradient id="hl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
              <path d="M22 132 C24 78 104 56 178 64 C242 70 288 96 278 128 C268 164 206 176 164 204 C122 232 66 238 40 204 C26 186 21 160 22 132Z" fill="url(#lv)"/>
              <path d="M150 72 C142 120 150 170 168 200" fill="none" stroke="#5E1712" stroke-width="3" opacity=".55"/>
              <ellipse cx="102" cy="108" rx="62" ry="26" fill="url(#hl)" transform="rotate(-12 102 108)"/>
              <path d="M150 198 C150 222 170 236 186 226 C196 218 190 200 176 194Z" fill="#6F8F3A"/></svg>
              <div class="stamp">للخطر</div></div></div>
          <div class="item" id="i1"><div class="lab">الكلى</div>
            <div class="card"><svg viewBox="0 0 300 300"><defs>
              <radialGradient id="kd" cx="0.35" cy="0.3" r="0.85"><stop offset="0" stop-color="#D4705C"/><stop offset="0.55" stop-color="#A53B2E"/><stop offset="1" stop-color="#651A14"/></radialGradient></defs>
              <path d="M88 60 C40 60 34 210 90 222 C128 230 136 182 118 162 C106 148 110 132 122 116 C134 94 122 60 88 60Z" fill="url(#kd)"/>
              <path d="M212 60 C260 60 266 210 210 222 C172 230 164 182 182 162 C194 148 190 132 178 116 C166 94 178 60 212 60Z" fill="url(#kd)"/>
              <path d="M118 150 C134 170 136 220 128 280 M182 150 C166 170 164 220 172 280" fill="none" stroke="#E2C3A0" stroke-width="7" stroke-linecap="round"/>
              <ellipse cx="74" cy="104" rx="16" ry="34" fill="url(#hl)"/><ellipse cx="226" cy="104" rx="16" ry="34" fill="url(#hl)"/></svg>
              <div class="stamp">للخطر</div></div></div>
          <div class="item" id="i2"><div class="lab">القلب</div>
            <div class="card"><svg viewBox="0 0 300 300"><defs>
              <radialGradient id="hr" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#E06452"/><stop offset="0.55" stop-color="#B0352A"/><stop offset="1" stop-color="#6A1712"/></radialGradient></defs>
              <path d="M128 96 C126 52 178 34 206 64" fill="none" stroke="#B33A2E" stroke-width="22" stroke-linecap="round"/>
              <path d="M160 86 C162 52 150 36 140 30" fill="none" stroke="#5C7DB0" stroke-width="16" stroke-linecap="round"/>
              <path d="M150 268 C86 226 46 172 58 120 C68 80 112 70 138 98 C156 70 208 62 236 98 C266 138 232 206 150 268Z" fill="url(#hr)"/>
              <path d="M140 110 C150 160 160 200 156 250" fill="none" stroke="#6A1712" stroke-width="3" opacity=".5"/>
              <ellipse cx="104" cy="126" rx="26" ry="40" fill="url(#hl)" transform="rotate(-20 104 126)"/></svg>
              <div class="stamp">للخطر</div></div></div>
        </div>
        <div class="bok" id="f1" style="left:-180px;top:1480px;width:420px;height:420px;background:#C9945F;filter:blur(48px);opacity:.5"></div>
        <div class="bok" id="f2" style="left:880px;top:380px;width:280px;height:280px;background:#E8B97F;filter:blur(40px);opacity:.45"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const D = 4.29, TH = 42, R = 760;
      // لحظات اللف: الكارت i بيبقى قدام على نطق كلمته (الكبد · الكلى · القلب)
      const STEPS = [[1.82, 1], [3.0, 2]];
      const io = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const back = k => { const s = 1.4; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
      const posAt = t => { let a = 0; STEPS.forEach(([s, v]) => { const k = Math.min(1, Math.max(0, (t - s) / 0.55)); a += k > 0 ? back(k) : 0; }); return a; };
      const items = [0, 1, 2].map(i => document.getElementById("i" + i));
      const layout = () => {
        const t = tl.time(), a = posAt(t), v = Math.abs(posAt(t + 1 / 60) - posAt(t - 1 / 60)) * 30;
        const enter = Math.min(1, Math.max(0, (t - 0.1) / 0.6)), e = io(enter);
        items.forEach((el, i) => {
          const phi = (i - a) * TH, rad = (phi * Math.PI) / 180, d = Math.min(1.4, Math.abs(phi) / TH);
          const x = -R * Math.sin(rad), z = R * Math.cos(rad) - R - (1 - e) * 900;
          const blur = d * 9 + v * 6 + (1 - e) * 18;   // عمق + بلر حركة
          el.style.transform = `translate3d(${x}px, ${(1 - e) * 60}px, ${z}px) rotateY(${phi * 0.85}deg)`;
          el.style.filter = `blur(${blur.toFixed(1)}px) brightness(${(1 - d * 0.12).toFixed(3)})`;
          el.style.opacity = (Math.max(0, 1 - d * 0.35) * Math.min(1, e * 1.4)).toFixed(3);
          el.style.zIndex = String(100 - Math.round(d * 10));
        });
      };
      tl.to({}, { duration: D, onUpdate: layout }, 0);
      tl.fromTo("#scene", { opacity: 0, scale: 1.05, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0);
      tl.to("#scene", { opacity: 0, scale: 1.06, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, D - 0.27);
      tl.fromTo(["#b1"], { y: 40 }, { y: -40, duration: D, ease: "none" }, 0);
      tl.fromTo("#b2", { y: 60 }, { y: -60, duration: D, ease: "none" }, 0);
      tl.fromTo(["#f1", "#f2"], { y: 180, x: 30 }, { y: -180, x: -30, duration: D, ease: "none" }, 0);
      [0.0, 0.17].forEach((at, i) => tl.fromTo(`#lead span:nth-child(${i + 1})`, { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, at));
      tl.fromTo("#big", { opacity: 0, scale: 1.2, filter: "blur(20px)" }, { opacity: 0.45, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.5)" }, 1.03);
      tl.fromTo("#big", { x: 60 }, { x: -60, duration: D, ease: "none" }, 0);
      // ختم «للخطر» على كل كارت على نطقه
      [1.03, 2.25, 3.87].forEach((at, i) => tl.fromTo(`#i${i} .stamp`, { opacity: 0, scale: 1.8, rotation: -8 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "back.out(2)" }, at));
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
