<!doctype html>
<html lang="ar" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "AmiriB"; src: url("assets/fonts/Amiri-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #wrap { position: absolute; inset: 0; perspective: 1400px; }
      /* عنوان أحمر غامق ضخم بعمق: طبقات ظل أغمق تحته (extrude) وظل ناعم على الحيطة */
      #word { position: absolute; top: 40px; left: -60px; right: -60px; text-align: center; font: 700 380px/1.25 "AmiriB"; color: #A12C20; white-space: nowrap;
        text-shadow: 0 2px 0 #8A2419, 0 4px 0 #7C2016, 0 6px 0 #6E1C13, 0 8px 0 #601810, 0 10px 0 #52140D, 0 30px 40px rgba(40,10,5,0.45); }
      .mk { position: absolute; font: 700 200px/1 "AmiriB"; color: #A12C20; text-shadow: 0 6px 0 #6E1C13, 0 18px 26px rgba(40,10,5,0.4); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.48" data-width="1080" data-height="1920">
      <div id="wrap" class="clip" data-start="0" data-duration="3.48" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="word">مصيبة</div>
        <div class="mk" id="m1" style="left:40px;top:60px">!</div>
        <div class="mk" id="m2" style="left:960px;top:20px">!</div>
        <div class="mk" id="m3" style="left:900px;top:470px;font-size:140px">!</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const D = 3.48;
      // بتقع من فوق بسرعة (ممطوطة ومضببة = بلر حركة) وبتقعد بنطّة، وبعدين بتقرب ببطء
      tl.fromTo("#word", { y: -520, scaleY: 1.5, scaleX: 0.92, rotationX: 40, opacity: 0, filter: "blur(22px)" },
        { y: 0, scaleY: 1, scaleX: 1, rotationX: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.5)" }, 0.02);
      tl.to("#word", { scale: 1.06, duration: D - 0.6, ease: "sine.inOut" }, 0.55);
      [["#m1", 0.3, -18], ["#m2", 0.45, 14], ["#m3", 0.6, 10]].forEach(([s, at, r]) =>
        tl.fromTo(s, { opacity: 0, scale: 0.3, rotation: r * 3, y: 40 }, { opacity: 1, scale: 1, rotation: r, y: 0, duration: 0.4, ease: "back.out(2.2)" }, at));
      tl.to("#wrap", { opacity: 0, y: -60, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, D - 0.27);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
