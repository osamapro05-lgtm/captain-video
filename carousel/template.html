<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=block" rel="stylesheet">
<style>
  /* Safe zone (Instagram 4:5): 110px sides, 150px bottom; nothing in the top-right (IG slide counter)
     or bottom-left (tag icon); the cover headline stays centred so the 3:4 profile-grid crop keeps it. */
  :root { --acc:/*ACC*/#FF7A1A; --ink:/*INK*/#14111F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:var(--ink); font-family:'Cairo',sans-serif; color:#fff; }
  .s { position:relative; width:1080px; height:1350px; overflow:hidden; }
  .ph { position:absolute; top:0; left:0; width:100%; height:980px; object-fit:cover; }
  .cover .ph, .cta .ph { height:1350px; }
  .sh { position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, color-mix(in srgb, var(--ink) 75%, transparent) 56%, var(--ink) 72%); }
  .cover .sh { background:linear-gradient(180deg, transparent 42%, color-mix(in srgb, var(--ink) 85%, transparent) 62%, var(--ink) 80%); }
  .box { position:absolute; right:110px; left:200px; bottom:150px; }
  .cover .box, .cta .box { left:110px; text-align:center; }
  .badge { display:inline-block; background:var(--acc); font-weight:900; font-size:32px; padding:6px 28px; border-radius:999px; }
  .tag { display:inline-flex; align-items:center; gap:18px; font-weight:900; font-size:34px; color:var(--acc); }
  .tag i { font-style:normal; display:grid; place-items:center; width:84px; height:84px; border-radius:50%; background:var(--acc); color:#fff; font-size:50px; line-height:1; }
  h2 { font-weight:900; font-size:92px; line-height:1.15; margin-top:18px; }
  .cover h2 { font-size:116px; line-height:1.12; margin-top:20px; }
  .cta h2 { font-size:116px; }
  p { font-weight:600; font-size:40px; line-height:1.6; color:rgba(255,255,255,.88); margin-top:20px; }
  .fix { margin-top:34px; padding:28px 34px; border-radius:28px; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.18); font-weight:600; font-size:37px; line-height:1.55; }
  .fix b { font-weight:900; color:var(--acc); }
  .hot .fix { background:var(--acc); border-color:var(--acc); }
  .hot .fix b { color:var(--ink); }
  .swipe { margin-top:30px; font-weight:900; font-size:36px; color:var(--acc); }
  .btn { display:inline-block; margin-top:36px; background:var(--acc); font-weight:900; font-size:42px; padding:20px 48px; border-radius:999px; }
  mark { background:none; color:var(--acc); }
</style>
</head>
<body>
<script>
  const SLIDES = /*SLIDES*/[];
  const n = +(new URLSearchParams(location.search).get('s') || 1);
  const d = SLIDES[n - 1], type = d.type || 'point';
  const photo = d.photo ? `<img class="ph" src="${d.photo}" style="object-position:${d.focus || '50% 30%'}"><div class="sh"></div>` : '';
  const parts = [];
  if (type === 'cover') {
    if (d.badge) parts.push(`<div class="badge">${d.badge}</div>`);
    parts.push(`<h2>${d.title}</h2>`);
    if (d.body) parts.push(`<p>${d.body}</p>`);
    parts.push(`<div class="swipe">${d.swipe || 'اسحب ←'}</div>`);
  } else if (type === 'cta') {
    parts.push(`<h2>${d.title}</h2>`);
    if (d.body) parts.push(`<p>${d.body}</p>`);
    if (d.button) parts.push(`<div class="btn">${d.button}</div>`);
  } else {
    parts.push(`<div class="tag"><i>${d.n}</i>${d.tag || ''}</div>`);
    parts.push(`<h2>${d.title}</h2>`);
    if (d.body) parts.push(`<p>${d.body}</p>`);
    if (d.fix) parts.push(`<div class="fix"><b>${d.fix_label || 'الحل'}:</b> ${d.fix}</div>`);
  }
  document.body.innerHTML = `<section class="s ${type}${d.hot ? ' hot' : ''}">${photo}<div class="box">${parts.join('')}</div></section>`;
</script>
</body>
</html>
